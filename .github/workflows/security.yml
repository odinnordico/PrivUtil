name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  gosec:
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6


      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build with Makefile
        run: make build

      - name: Run Gosec Security Scanner
        # Pinned to a commit SHA (v2.28.0) instead of the mutable @master ref so
        # untrusted upstream code cannot run in a job with security-events: write.
        # -no-fail so the SARIF upload below always runs; enforcement happens via
        # the code-scanning alert gate rather than a hard job failure.
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: -no-fail -fmt sarif -out results.sarif -exclude-generated ./...

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          sarif_file: results.sarif
