name: Publish

on:
  release:
    types: [published]

# Only contents: write is needed to attach assets to the Release; this workflow
# never pushes to a registry.
permissions:
    contents: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: arm64
            goos: windows
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: 'go.mod'
        check-latest: true
    - name: Build and Archive
      run: |
        # Pass the tag explicitly: the default checkout is shallow and tagless,
        # so the Makefile's `git describe` would otherwise fall back to dev-<sha>
        # and the released binaries would report the wrong version.
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build BUILD_VERSION=${{ github.event.release.tag_name }}
        
        ARCHIVE_NAME="privutil-${{ matrix.goos }}-${{ matrix.goarch }}"
        
        if [ "${{ matrix.goos }}" = "windows" ]; then
          # Ensure .exe exists, fallback if necessary (some build systems might not add it automatically)
          if [ ! -f privutil.exe ] && [ -f privutil ]; then mv privutil privutil.exe; fi
          zip "${ARCHIVE_NAME}.zip" privutil.exe
          echo "ARTIFACT_PATH=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
        else
          tar -czf "${ARCHIVE_NAME}.tar.gz" privutil
          echo "ARTIFACT_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.ARTIFACT_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
