name: Build and publish a Docker image to ghcr.io
# Fires on a published GitHub Release (the same event as publish.yml) so the
# image and the release binaries are always produced together from one event.
on:
  release:
    types: [published]

# Serialize per-release; never cancel a publish in progress.
concurrency:
  group: docker-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        # Needed to emulate the arm64 runtime stage's RUN (adduser) on the amd64 runner.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the image name, so the mixed-case repo
          # (odinnordico/PrivUtil) becomes ghcr.io/odinnordico/privutil.
          images: ghcr.io/${{ github.repository }}
          # type=ref,event=tag does not populate on release events, so the
          # version tag comes from the release tag_name directly.
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            # Only move :latest for stable releases; a GitHub pre-release
            # (e.g. v2.0.0-rc1 marked pre-release) must not overwrite it.
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach a full SLSA provenance attestation and an SBOM to the image.
          provenance: mode=max
          sbom: true
          # Stamp the release version into the binary (main.Version); the build
          # context has no .git, so the version cannot be derived inside the image.
          build-args: |
            VERSION=${{ github.event.release.tag_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless)
        # Sign by digest so every tag pointing at it (version + latest) is covered
        # by one signature; verify later with `cosign verify`.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"

      - name: Verify version-pinned multi-arch tag was published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "Verifying ${image} exists with linux/amd64 + linux/arm64..."
          raw="$(docker buildx imagetools inspect "${image}" --raw)"
          echo "${raw}"
          for arch in amd64 arm64; do
            echo "${raw}" | jq -e --arg a "${arch}" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)' >/dev/null \
              || { echo "::error::missing linux/${arch} manifest in ${image}"; exit 1; }
          done
          echo "OK: ${image} publishes linux/amd64 and linux/arm64."
